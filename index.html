<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>engin@erkus:~$</title>
<meta name="description" content="Engin Erkus — Data Scientist & OSINT Analyst">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▮</text></svg>">
<style>
  :root {
    --bg: #0a0e0a;
    --fg: #b8f5b8;
    --dim: #4f7a4f;
    --accent: #39ff6a;
    --warn: #ffb347;
    --err: #ff5f5f;
    --link: #6ad8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--fg);
    font: bold 15px/1.55 "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  /* subtle CRT scanlines */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }
  #term {
    height: 100%; overflow-y: auto; padding: 24px clamp(14px, 4vw, 48px) 40px;
    max-width: 920px; margin: 0 auto;
  }
  .line { white-space: pre-wrap; word-break: break-word; }
  .dim { color: var(--dim); }
  .acc { color: var(--accent); }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  a { color: var(--link); text-decoration: none; border-bottom: 1px dotted var(--link); }
  a:hover { background: var(--link); color: var(--bg); }
  .cmd { color: var(--accent); cursor: pointer; }
  .cmd:hover { text-decoration: underline; }
  .prompt { color: var(--accent); }
  .prompt .path { color: var(--link); }
  #input-line { display: flex; gap: .6ch; }
  #input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--fg); font: inherit; caret-color: var(--accent);
  }
  .ascii { color: var(--accent); line-height: 1.15; font-size: clamp(7px, 1.9vw, 14px); }
  ::selection { background: var(--accent); color: var(--bg); }
  #term::-webkit-scrollbar { width: 6px; }
  #term::-webkit-scrollbar-thumb { background: var(--dim); }

  /* matrix rain background */
  #rain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: .14; transition: opacity .8s ease;
  }
  #rain.loud { opacity: .55; }
  #term { position: relative; z-index: 1; }

  /* glitch on the banner */
  .glitch { animation: glitch 7s infinite steps(1); }
  @keyframes glitch {
    0%, 93%, 100% { text-shadow: none; transform: none; }
    94% { text-shadow: 2px 0 var(--err), -2px 0 var(--link); transform: translateX(1px); }
    95% { text-shadow: -3px 0 var(--err), 3px 0 var(--link); transform: translateX(-2px) skewX(-4deg); }
    96% { text-shadow: 1px 0 var(--err), -1px 0 var(--link); transform: none; }
  }
  .bar { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .glitch { animation: none; }
    #rain { display: none; }
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="term" aria-live="polite">
  <div id="out"></div>
  <div id="input-line" hidden>
    <span class="prompt">visitor@erkus<span class="dim">:</span><span class="path">~</span><span class="dim">$</span></span>
    <input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input">
  </div>
</div>

<script>
/* ===== REDIGÉR DIT INDHOLD HER ===== */
const ME = {
  name: "Engin Erkus",
  title: "Data Scientist · OSINT Analyst",
  email: "engin@engin.dk",                       
  //linkedin: "https://linkedin.com/in/DIT-NAVN",
};

const PAGES = {
  about: `
<span class="acc">## whoami</span>
${ME.name} — ${ME.title}

MSc i Data Science fra SDU. Arbejder med open source intelligence,
dataanalyse og machine learning — at finde signal i støjen.

Sprog: dansk · engelsk · tyrkisk · arabisk`,

  skills: `
<span class="acc">## skills</span>
<span class="dim">[osint]</span>    kildeanalyse · verifikation · geolokation · netværksanalyse
<span class="dim">[data]</span>     python · pandas · sql · visualisering
<span class="dim">[ml]</span>       pytorch · bayesian methods · reinforcement learning · LLM/RAG
<span class="dim">[sec]</span>      linux · ethical hacking <span class="dim">(lærer stadig)</span>`,

  projects: `
<span class="acc">## projects</span>
<span class="warn">01</span>  GP-TD3 — Bayesian reinforcement learning med Gaussian Process critics (speciale)
<span class="warn">02</span>  Lokalt LLM-system med RAG til analysearbejde
<span class="warn">03</span>  Skalerbar OSINT-pipeline til virksomhedsverifikation
<span class="warn">04</span>  ML-model til intraday-handel på elmarkedet`,

  contact: () => {
    let s = `\n<span class="acc">## contact</span>\n`;
    if (ME.email) s += `mail      <a href="mailto:${ME.email}">${ME.email}</a>\n`;
    if (ME.linkedin) s += `linkedin  <a href="${ME.linkedin}" target="_blank" rel="noopener">${ME.linkedin.replace("https://", "")}</a>\n`;
    return s;
  },
};
/* ===== SLUT PÅ INDHOLD ===== */

const out = document.getElementById("out");
const input = document.getElementById("input");
const inputLine = document.getElementById("input-line");
const term = document.getElementById("term");
const history = []; let hIdx = 0;

const BANNER = `
 ███████╗███╗   ██╗ ██████╗ ██╗███╗   ██╗
 ██╔════╝████╗  ██║██╔════╝ ██║████╗  ██║
 █████╗  ██╔██╗ ██║██║  ███╗██║██╔██╗ ██║
 ██╔══╝  ██║╚██╗██║██║   ██║██║██║╚██╗██║
 ███████╗██║ ╚████║╚██████╔╝██║██║ ╚████║
 ╚══════╝╚═╝  ╚═══╝ ╚═════╝ ╚═╝╚═╝  ╚═══╝`;

const c = (name) => `<span class="cmd" data-cmd="${name}">${name}</span>`;
const cl = (label, cmd) => `<span class="cmd" data-cmd="${cmd}">${label}</span>`;

/* mini-CTF i .secrets */
let unlocked = false;
const SECRET = {
  hint: "c2lnbmFs",   // base64 af kodeordet
  flag: `
<span class="acc">## flag.txt</span>
flag{signal_i_stoejen}

Godt gået. Du fandt den skjulte fil, dekodede kodeordet og kom ind.
Send flaget til mig via ${c("contact")}, hvis du vil sige hej.`,
};

const COMMANDS = {
  help: () => `
Tilgængelige kommandoer:
  ${c("about")}      hvem jeg er
  ${c("skills")}     hvad jeg arbejder med
  ${c("projects")}   udvalgte projekter
  ${c("contact")}    kom i kontakt
  ${c("ls")}         vis filer
  ${c("clear")}      ryd skærmen

<span class="dim">// ekstra</span>
  ${c("whois")}      hvad din browser afslører om dig
  ${c("trace")}      spor forbindelsen
  ${c("hack")}       prøv lykken
  ${c("matrix")}     skru op for regnen
<span class="dim">tip: ↑/↓ for historik, tab for autocomplete</span>`,
  matrix: () => {
    const on = rainEl.classList.toggle("loud");
    return on ? `<span class="acc">wake up, visitor...</span>` : `<span class="dim">back to normal.</span>`;
  },
  whois: () => {
    const n = navigator, s = screen;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const os = /Windows/.test(n.userAgent) ? "Windows" : /Mac/.test(n.userAgent) ? "macOS"
      : /Android/.test(n.userAgent) ? "Android" : /iPhone|iPad/.test(n.userAgent) ? "iOS"
      : /Linux/.test(n.userAgent) ? "Linux" : "ukendt";
    const br = /Edg\//.test(n.userAgent) ? "Edge" : /Chrome\//.test(n.userAgent) ? "Chrome"
      : /Firefox\//.test(n.userAgent) ? "Firefox" : /Safari\//.test(n.userAgent) ? "Safari" : "ukendt";
    return `
<span class="acc">## whois visitor</span>
os          ${os}
browser     ${br}
sprog       ${esc(n.language || "?")}
tidszone    ${esc(tz || "?")}
skærm       ${s.width}x${s.height} @ ${window.devicePixelRatio}x
cpu-kerner  ${n.hardwareConcurrency || "?"}
dark mode   ${matchMedia("(prefers-color-scheme: dark)").matches ? "ja" : "nej"}

<span class="dim">// alt det her ved enhver side du besøger. intet af det gemmes her.</span>`;
  },
  trace: async () => {
    const hops = ["visitor.local", "gw.isp.net", "core-cph.backbone", "ix.dk-peering", "edge.cdn", "engin.dk"];
    print(`traceroute to engin.dk, ${hops.length} hops max`, "dim");
    for (let i = 0; i < hops.length; i++) {
      await sleep(320 + Math.random() * 300);
      const ms = (4 + i * 3 + Math.random() * 4).toFixed(1);
      print(` ${i + 1}  ${hops[i].padEnd(20)} ${ms} ms`, i === hops.length - 1 ? "acc" : "");
    }
    await sleep(250);
    return `<span class="acc">connection established.</span> du fandt mig.`;
  },
  hack: async () => {
    const steps = ["bypassing firewall", "decrypting mainframe", "escalating privileges"];
    for (const s of steps) {
      const line = document.createElement("div");
      line.className = "line";
      out.appendChild(line);
      for (let p = 0; p <= 20; p++) {
        line.innerHTML = `${s.padEnd(24)} <span class="bar">[${"#".repeat(p)}${".".repeat(20 - p)}]</span> ${p * 5}%`;
        term.scrollTop = term.scrollHeight;
        await sleep(25 + Math.random() * 40);
      }
    }
    await sleep(300);
    return `<span class="err">ACCESS DENIED.</span> nice try ;)`;
  },
  about: () => PAGES.about,
  whoami: () => PAGES.about,
  skills: () => PAGES.skills,
  projects: () => PAGES.projects,
  contact: () => PAGES.contact(),
  ls: (arg) => {
    const files = ["about.txt", "skills.txt", "projects.txt", "contact.txt"].map(f => cl(f, "cat " + f));
    if (arg && arg.startsWith("-") && arg.includes("a")) files.push(cl(".hint", "cat .hint"));
    files.push(`<span class="dim">${cl(".secrets/", "cd .secrets")}</span>`);
    return files.join("  ");
  },
  cat: (arg = "") => {
    if (arg === ".hint") return `
<span class="warn">${SECRET.hint}</span>
<span class="dim">// base64. dekod den, og kør:</span> unlock &lt;kodeord&gt;`;
    if (arg.replace(/^\.\//, "").startsWith(".secrets/")) {
      if (!unlocked) return `<span class="err">cat: ${esc(arg)}: Permission denied</span>`;
      if (arg.endsWith("flag.txt")) return SECRET.flag;
    }
    const k = arg.replace(".txt", "");
    if (PAGES[k]) return typeof PAGES[k] === "function" ? PAGES[k]() : PAGES[k];
    return `<span class="err">cat: ${esc(arg)}: No such file or directory</span>`;
  },
  cd: (arg = "") => {
    if (arg.replace(/^\.\//, "").replace(/\/$/, "") === ".secrets") {
      if (unlocked) return `${cl("flag.txt", "cat .secrets/flag.txt")}`;
      return `<span class="err">bash: cd: .secrets: Permission denied</span>
<span class="dim">// ikke alle filer er synlige. prøv</span> ${cl("ls -a", "ls -a")}`;
    }
    return `<span class="dim">der er ikke så meget at se her ¯\\_(ツ)_/¯</span>`;
  },
  unlock: (pw) => {
    if (!pw) return `<span class="dim">brug:</span> unlock &lt;kodeord&gt;`;
    if (pw.toLowerCase() === atob(SECRET.hint)) {
      unlocked = true;
      return `<span class="acc">ACCESS GRANTED.</span> .secrets/ er låst op → ${cl("cd .secrets", "cd .secrets")}`;
    }
    return `<span class="err">ACCESS DENIED.</span> forkert kodeord.`;
  },
  sudo: () => `<span class="err">visitor is not in the sudoers file. This incident will be reported.</span>`,
  date: () => new Date().toString(),
  echo: (...a) => esc(a.join(" ")),
  banner: () => `<div class="ascii glitch">${BANNER}</div>`,
  clear: () => { out.innerHTML = ""; showHome(); return null; },
};

function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[ch])); }

function print(html, cls = "") {
  const d = document.createElement("div");
  d.className = "line " + cls;
  d.innerHTML = html;
  out.appendChild(d);
  term.scrollTop = term.scrollHeight;
}

function promptHTML(cmd) {
  return `<span class="prompt">visitor@erkus<span class="dim">:</span><span class="path">~</span><span class="dim">$</span></span> ${esc(cmd)}`;
}

function run(raw) {
  const cmd = raw.trim();
  print(promptHTML(cmd));
  if (!cmd) return;
  history.push(cmd); hIdx = history.length;
  let [name, ...args] = cmd.split(/\s+/);
  if (/^\.{0,2}\//.test(name) || name.startsWith(".secrets")) { args = [name]; name = "cd"; }
  const fn = COMMANDS[name.toLowerCase()];
  if (!fn) return print(`<span class="err">command not found: ${esc(name)}</span> — prøv ${c("help")}`);
  const res = fn(...args);
  if (res instanceof Promise) {
    inputLine.hidden = true;
    res.then(r => { if (r) print(r); inputLine.hidden = false; input.focus(); });
  } else if (res !== null) print(res);
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { run(input.value); input.value = ""; }
  else if (e.key === "ArrowUp") { if (hIdx > 0) input.value = history[--hIdx]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] || ""; }
  else if (e.key === "Tab") {
    e.preventDefault();
    const m = Object.keys(COMMANDS).filter(k => k.startsWith(input.value));
    if (m.length === 1) input.value = m[0];
  } else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); COMMANDS.clear(); }
});

out.addEventListener("click", (e) => {
  const t = e.target.closest(".cmd");
  if (t) { run(t.dataset.cmd); input.focus(); }
});
term.addEventListener("click", () => { if (!getSelection().toString()) input.focus(); });

function showHome() {
  print(`<div class="ascii glitch">${BANNER}</div>`);
  print(`${ME.title}\n`);
  print(`Velkommen. Skriv ${c("help")} for at komme i gang — eller klik på en kommando.\n`);
}

/* matrix rain */
const rainEl = document.getElementById("rain");
(function rain() {
  const ctx = rainEl.getContext("2d");
  const chars = "01アイウエオカキクケコサシスセソタチツテト<>/{}[]#$%&*01";
  const size = 16;
  let cols, drops;
  function resize() {
    rainEl.width = innerWidth; rainEl.height = innerHeight;
    cols = Math.ceil(innerWidth / size);
    drops = Array.from({ length: cols }, () => Math.random() * -50);
  }
  resize(); addEventListener("resize", resize);
  let last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 55) return;   // ~18 fps — rolig og let for CPU'en
    last = t;
    ctx.fillStyle = "rgba(10,14,10,0.12)";
    ctx.fillRect(0, 0, rainEl.width, rainEl.height);
    ctx.font = size + "px monospace";
    for (let i = 0; i < cols; i++) {
      const y = drops[i] * size;
      ctx.fillStyle = Math.random() < 0.04 ? "#d9ffe0" : "#39ff6a";
      ctx.fillText(chars[Math.random() * chars.length | 0], i * size, y);
      if (y > rainEl.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  requestAnimationFrame(frame);
})();

/* boot sequence */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function boot() {
  const steps = [
    ["[ ok ] initializing session...", "dim"],
    ["[ ok ] routing through 3 relays...", "dim"],
    ["[ ok ] handshake complete", "dim"],
  ];
  for (const [t, cls] of steps) { print(t, cls); await sleep(260); }
  await sleep(150);
  showHome();
  inputLine.hidden = false;
  input.focus();
}
boot();
</script>
</body>
</html>

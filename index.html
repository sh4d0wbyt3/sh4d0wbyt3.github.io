<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>engin@erkus:~$</title>
<meta name="description" content="Engin Erkus — Data Scientist & OSINT Analyst">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▮</text></svg>">
<style>
  :root {
    --bg: #0a0e0a;
    --fg: #b8f5b8;
    --dim: #4f7a4f;
    --accent: #39ff6a;
    --warn: #ffb347;
    --err: #ff5f5f;
    --link: #6ad8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--fg);
    font: bold 15px/1.55 "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  /* subtle CRT scanlines */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }
  #term {
    height: 100%; overflow-y: auto; padding: 24px clamp(14px, 4vw, 48px) 40px;
    max-width: 920px; margin: 0 auto;
  }
  .line { white-space: pre-wrap; word-break: break-word; }
  .dim { color: var(--dim); }
  .acc { color: var(--accent); }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  a { color: var(--link); text-decoration: none; border-bottom: 1px dotted var(--link); }
  a:hover { background: var(--link); color: var(--bg); }
  .cmd { color: var(--accent); cursor: pointer; }
  .cmd:hover { text-decoration: underline; }
  .prompt { color: var(--accent); }
  .prompt .path { color: var(--link); }
  #input-line { display: flex; gap: .6ch; }
  [hidden] { display: none !important; }
  #input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--fg); font: inherit; caret-color: var(--accent);
  }
  .ascii { color: var(--accent); line-height: 1.15; font-size: clamp(7px, 1.9vw, 14px); }
  ::selection { background: var(--accent); color: var(--bg); }
  #term::-webkit-scrollbar { width: 6px; }
  #term::-webkit-scrollbar-thumb { background: var(--dim); }

  /* matrix rain background */
  #rain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: .14; transition: opacity .8s ease;
  }
  #rain.loud { opacity: .55; }
  #term { position: relative; z-index: 1; }

  /* glitch on the banner */
  .glitch { animation: glitch 7s infinite steps(1); }
  @keyframes glitch {
    0%, 93%, 100% { text-shadow: none; transform: none; }
    94% { text-shadow: 2px 0 var(--err), -2px 0 var(--link); transform: translateX(1px); }
    95% { text-shadow: -3px 0 var(--err), 3px 0 var(--link); transform: translateX(-2px) skewX(-4deg); }
    96% { text-shadow: 1px 0 var(--err), -1px 0 var(--link); transform: none; }
  }
  .bar { color: var(--accent); }
  .login-input {
    background: transparent; border: 0; outline: 0; width: 18ch;
    color: var(--fg); font: inherit; caret-color: var(--accent);
  }
  /* ===== INTRO ===== */
  #intro {
    position: fixed; inset: 0; z-index: 10; background: rgba(10, 14, 10, .9);
    overflow: hidden; cursor: pointer;
  }
  #intro::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }
  #intro canvas { position: absolute; inset: 0; }
  #intro-log {
    position: absolute; inset: 0; margin: 0; padding: 14px 18px;
    font-size: 12px; line-height: 1.4; color: var(--dim);
    white-space: pre-wrap; overflow: hidden;
  }
  #intro-log .ok { color: var(--accent); }
  #intro-log .hi { color: var(--fg); }
  #intro-log .red { color: var(--err); }
  #intro-scan {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(560px, 90vw); font-size: 15px; line-height: 1.55; color: var(--fg);
    white-space: pre-wrap;
  }
  #intro-scan .k { color: var(--dim); }
  #intro-scan .v { color: var(--accent); }
  #intro-scan .cur { display: inline-block; width: .6em; background: var(--accent); animation: blink 1s steps(1) infinite; }
  #intro-login {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.96);
    width: min(720px, 92vw);
    font-size: 15px; line-height: 1.55; color: var(--fg);
    background: #0b0f0b; border-radius: 10px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .08), 0 0 50px rgba(57, 255, 106, .08);
    opacity: 0; transition: opacity .35s, transform .35s; cursor: text;
  }
  #intro-login.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #intro-login .titlebar {
    display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px;
    background: #2b2b2b; border-bottom: 1px solid #1c1c1c;
    font: 600 13px/1 system-ui, "Ubuntu", "Segoe UI", sans-serif; color: #e6e6e6;
    user-select: none; cursor: grab;
  }
  #intro-login .titlebar:active { cursor: grabbing; }
  #intro-login .tb-title { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #intro-login .tb-btn {
    width: 30px; height: 28px; border-radius: 6px; display: grid; place-items: center;
    background: #3a3a3a; color: #e6e6e6; flex: none; cursor: pointer;
  }
  #intro-login .tb-btn:hover { background: #474747; }
  #intro-login .tb-win {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    background: #3a3a3a; color: #e6e6e6; flex: none; cursor: pointer; margin-left: 4px;
  }
  #intro-login .tb-win:hover { background: #4a4a4a; }
  #intro-login .tb-win.close { background: #e95420; color: #fff; }
  #intro-login .tb-win.close:hover { background: #f26b3a; }
  #intro-login svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  #intro-login .tb-win svg { width: 10px; height: 10px; stroke-width: 1.8; }
  #intro-login .body { white-space: pre-wrap; min-height: 18em; padding: 12px 14px 16px; }
  #intro-login .acc { color: var(--accent); }
  #intro-login .dim { color: var(--dim); }
  #intro-login .warnline { color: var(--warn); margin: .8em 0; }
  #intro-login .ghost { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  #intro-login .typed { color: var(--fg); }
  #intro-login .blk { display: inline-block; width: .6em; background: var(--accent); animation: blink 1s steps(1) infinite; }
  #intro-login.jolt { animation: jolt .28s steps(2) 1; }
  @keyframes jolt {
    0%   { transform: translate(-50%, -50%) translateX(0); filter: none; }
    33%  { transform: translate(-50%, -50%) translateX(-4px); filter: drop-shadow(3px 0 var(--err)) drop-shadow(-3px 0 var(--link)); }
    66%  { transform: translate(-50%, -50%) translateX(3px); }
    100% { transform: translate(-50%, -50%) translateX(0); filter: none; }
  }
  @media (max-width: 520px) {
    #intro-login { font-size: 11.5px; }
    #intro-login .body { padding: 10px 10px 12px; }
    #intro-login .tb-btn.opt { display: none; }
  }
  #intro-granted {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9);
    padding: clamp(12px, 2vw, 16px) clamp(18px, 4vw, 36px); white-space: nowrap; max-width: 94vw; border: 2px solid var(--accent); color: var(--accent); background: #000;
    font-size: clamp(15px, 3vw, 28px); letter-spacing: .22em; font-weight: bold;
    box-shadow: 0 0 60px rgba(57,255,106,.5); opacity: 0; transition: opacity .15s, transform .25s;
  }
  #intro-granted.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  @keyframes blink { 50% { opacity: 0; } }
  #intro.off { animation: crt-off .55s ease-in forwards; }
  @keyframes crt-off {
    0%   { transform: scale(1, 1); filter: brightness(1); }
    55%  { transform: scale(1, .004); filter: brightness(3); }
    100% { transform: scale(0, .004); filter: brightness(5); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #intro, #intro * { animation: none !important; transition: none !important; }
    .glitch { animation: none; }
    #rain { display: none; }
  }
</style>

    <span class="prompt">engin@erkus<span class="dim">:</span><span class="path">~</span><span class="dim">$</span></span>

<script>
/* ===== REDIGÉR DIT INDHOLD HER ===== */
const ME = {
  name: "Engin Erkus",
  title: "Data Scientist · OSINT Analyst",
  email: "engin@engin.dk",                       
  //linkedin: "https://linkedin.com/in/DIT-NAVN",
};

const PAGES = {
  about: `
<span class="acc">## whoami</span>
${ME.name} — ${ME.title}

MSc i Data Science fra SDU. Arbejder med open source intelligence,
dataanalyse og machine learning — at finde signal i støjen.

Sprog: dansk · engelsk · tyrkisk · arabisk`,

  skills: `
<span class="acc">## skills</span>
<span class="dim">[osint]</span>    kildeanalyse · verifikation · geolokation · netværksanalyse
<span class="dim">[data]</span>     python · pandas · sql · visualisering

<span class="dim">[sec]</span>      linux · ethical hacking <span class="dim">(lærer stadig)</span>`,

  projects: `
<span class="acc">## projects</span>
<span class="warn">01</span>  GP-TD3 — Bayesian reinforcement learning med Gaussian Process critics (speciale)
<span class="warn">02</span>  Lokalt LLM-system med RAG til analysearbejde
<span class="warn">03</span>  Skalerbar OSINT-pipeline til virksomhedsverifikation
<span class="warn">04</span>  ML-model til intraday-handel på elmarkedet`,

  contact: () => {
    let s = `\n<span class="acc">## contact</span>\n`;
    if (ME.email) s += `mail      <a href="mailto:${ME.email}">${ME.email}</a>\n`;
    if (ME.linkedin) s += `linkedin  <a href="${ME.linkedin}" target="_blank" rel="noopener">${ME.linkedin.replace("https://", "")}</a>\n`;

};
/* ===== SLUT PÅ INDHOLD ===== */

const out = document.getElementById("out");
const input = document.getElementById("input");
const inputLine = document.getElementById("input-line");
const term = document.getElementById("term");
const history = []; let hIdx = 0;

const BANNER = `
 ███████╗███╗   ██╗ ██████╗ ██╗███╗   ██╗
 ██╔════╝████╗  ██║██╔════╝ ██║████╗  ██║
 █████╗  ██╔██╗ ██║██║  ███╗██║██╔██╗ ██║
 ██╔══╝  ██║╚██╗██║██║   ██║██║██║╚██╗██║
 ███████╗██║ ╚████║╚██████╔╝██║██║ ╚████║
 ╚══════╝╚═╝  ╚═══╝ ╚═════╝ ╚═╝╚═╝  ╚═══╝`;

const c = (name) => `<span class="cmd" data-cmd="${name}">${name}</span>`;
const cl = (label, cmd) => `<span class="cmd" data-cmd="${cmd}">${label}</span>`;

/* mini-CTF i .secrets */
let unlocked = false;
const SECRET = {
  hint: "c2lnbmFs",   // base64 af kodeordet
  flag: `
<span class="acc">## flag.txt</span>
flag{signal_i_stoejen}

Godt gået. Du fandt den skjulte fil, dekodede kodeordet og kom ind.
Send flaget til mig via ${c("contact")}, hvis du vil sige hej.`,
};

const COMMANDS = {
  help: () => `
Tilgængelige kommandoer:
  ${c("about")}      hvem jeg er
  ${c("skills")}     hvad jeg arbejder med
  ${c("projects")}   udvalgte projekter
  ${c("contact")}    kom i kontakt
  ${c("ls")}         vis filer
  ${c("clear")}      ryd skærmen

<span class="dim">// ekstra</span>
  ${c("whois")}      hvad din browser afslører om dig
  ${c("trace")}      spor forbindelsen
  ${c("hack")}       prøv lykken
  ${c("matrix")}     skru op for regnen
<span class="dim">tip: ↑/↓ for historik, tab for autocomplete</span>`,
  matrix: () => {
    const on = rainEl.classList.toggle("loud");
    return on ? `<span class="acc">wake up, ${esc(USER)}...</span>` : `<span class="dim">back to normal.</span>`;
  },
  whois: () => {
    const n = navigator, s = screen;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const os = /Windows/.test(n.userAgent) ? "Windows" : /Mac/.test(n.userAgent) ? "macOS"
      : /Android/.test(n.userAgent) ? "Android" : /iPhone|iPad/.test(n.userAgent) ? "iOS"
      : /Linux/.test(n.userAgent) ? "Linux" : "ukendt";
    const br = /Edg\//.test(n.userAgent) ? "Edge" : /Chrome\//.test(n.userAgent) ? "Chrome"
      : /Firefox\//.test(n.userAgent) ? "Firefox" : /Safari\//.test(n.userAgent) ? "Safari" : "ukendt";
    return `
<span class="acc">## whois ${esc(USER)}</span>
os          ${os}
browser     ${br}
sprog       ${esc(n.language || "?")}
tidszone    ${esc(tz || "?")}
skærm       ${s.width}x${s.height} @ ${window.devicePixelRatio}x
cpu-kerner  ${n.hardwareConcurrency || "?"}
dark mode   ${matchMedia("(prefers-color-scheme: dark)").matches ? "ja" : "nej"}

<span class="dim">// alt det her ved enhver side du besøger. intet af det gemmes her.</span>`;
  },
  trace: async () => {
    const hops = ["visitor.local", "gw.isp.net", "core-cph.backbone", "ix.dk-peering", "edge.cdn", "engin.dk"];
    print(`traceroute to engin.dk, ${hops.length} hops max`, "dim");
    for (let i = 0; i < hops.length; i++) {
      await sleep(320 + Math.random() * 300);
      const ms = (4 + i * 3 + Math.random() * 4).toFixed(1);
      print(` ${i + 1}  ${hops[i].padEnd(20)} ${ms} ms`, i === hops.length - 1 ? "acc" : "");
    }
    await sleep(250);
    return `<span class="acc">connection established.</span> du fandt mig.`;
  },
  hack: async () => {
    const steps = ["bypassing firewall", "decrypting mainframe", "escalating privileges"];
    for (const s of steps) {
      const line = document.createElement("div");
      line.className = "line";
      out.appendChild(line);
      for (let p = 0; p <= 20; p++) {
        line.innerHTML = `${s.padEnd(24)} <span class="bar">[${"#".repeat(p)}${".".repeat(20 - p)}]</span> ${p * 5}%`;
        term.scrollTop = term.scrollHeight;
        await sleep(25 + Math.random() * 40);
      }
    }
    await sleep(300);
    return `<span class="err">ACCESS DENIED.</span> nice try ;)`;
  },
  about: () => PAGES.about,
  whoami: () => PAGES.about,
  skills: () => PAGES.skills,
  projects: () => PAGES.projects,
  contact: () => PAGES.contact(),
  ls: (arg) => {
    const files = ["about.txt", "skills.txt", "projects.txt", "contact.txt"].map(f => cl(f, "cat " + f));
    if (arg && arg.startsWith("-") && arg.includes("a")) files.push(cl(".hint", "cat .hint"));
    files.push(`<span class="dim">${cl(".secrets/", "cd .secrets")}</span>`);
    return files.join("  ");
  },
  cat: (arg = "") => {
    if (arg === ".hint") return `
<span class="warn keep">${SECRET.hint}</span>
<span class="dim">// base64. dekod den, og kør:</span> unlock &lt;kodeord&gt;`;
    if (arg.replace(/^\.\//, "").startsWith(".secrets/")) {
      if (!unlocked) return `<span class="err">cat: ${esc(arg)}: Permission denied</span>`;
      if (arg.endsWith("flag.txt")) return SECRET.flag;
    }
    const k = arg.replace(".txt", "");
    if (PAGES[k]) return typeof PAGES[k] === "function" ? PAGES[k]() : PAGES[k];
    return `<span class="err">cat: ${esc(arg)}: No such file or directory</span>`;
  },
  cd: (arg = "") => {
    if (arg.replace(/^\.\//, "").replace(/\/$/, "") === ".secrets") {
      if (unlocked) return `${cl("flag.txt", "cat .secrets/flag.txt")}`;
      return `<span class="err">bash: cd: .secrets: Permission denied</span>
<span class="dim">// ikke alle filer er synlige. prøv</span> ${cl("ls -a", "ls -a")}`;
    }
    return `<span class="dim">der er ikke så meget at se her ¯\\_(ツ)_/¯</span>`;
  },
  unlock: (pw) => {
    if (!pw) return `<span class="dim">brug:</span> unlock &lt;kodeord&gt;`;
    if (pw.toLowerCase() === atob(SECRET.hint)) {
      unlocked = true;
      return `<span class="acc">ACCESS GRANTED.</span> .secrets/ er låst op → ${cl("cd .secrets", "cd .secrets")}`;
    }
    return `<span class="err">ACCESS DENIED.</span> forkert kodeord.`;
  },
  sudo: () => `<span class="err">${esc(USER)} is not in the sudoers file. This incident will be reported.</span>`,
  date: () => new Date().toString(),
  echo: (...a) => esc(a.join(" ")),
  banner: () => `<div class="ascii glitch">${BANNER}</div>`,
  clear: () => { out.innerHTML = ""; showHome(); return null; },
};

function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[ch])); }

function print(html, cls = "") {
  const d = document.createElement("div");
  d.className = "line " + cls;
  d.innerHTML = html;
  out.appendChild(d);
  term.scrollTop = term.scrollHeight;
}

function promptHTML(cmd) {
  return `<span class="prompt">engin@erkus<span class="dim">:</span><span class="path">~</span><span class="dim">$</span></span> ${esc(cmd)}`;
}

function run(raw) {
  const cmd = raw.trim();
  print(promptHTML(cmd));
  if (!cmd) return;
  history.push(cmd); hIdx = history.length;
  let [name, ...args] = cmd.toLowerCase().split(/\s+/);
  if (/^\.{0,2}\//.test(name) || name.startsWith(".secrets")) { args = [name]; name = "cd"; }
  const fn = COMMANDS[name.toLowerCase()];
  if (!fn) return print(`<span class="err">command not found: ${esc(name)}</span> — prøv ${c("help")}`);
  const res = fn(...args);
  if (res instanceof Promise) {
    inputLine.hidden = true;
    res.then(r => { if (r) print(r); inputLine.hidden = false; input.focus(); });
  } else if (res !== null) print(res);
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { run(input.value); input.value = ""; }
  else if (e.key === "ArrowUp") { if (hIdx > 0) input.value = history[--hIdx]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] || ""; }
  else if (e.key === "Tab") {
    e.preventDefault();
    const m = Object.keys(COMMANDS).filter(k => k.startsWith(input.value));
    if (m.length === 1) input.value = m[0];
  } else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); COMMANDS.clear(); }
});

out.addEventListener("click", (e) => {
  const t = e.target.closest(".cmd");
  if (t) { run(t.dataset.cmd); input.focus(); }
});
term.addEventListener("click", () => { if (!getSelection().toString()) (activeInput || input).focus(); });

function showHome() {
  print(`<div class="ascii glitch">${BANNER}</div>`);
  print(`${ME.title}\n`);
  print(`Velkommen, <span class="acc">${esc(USER)}</span>. Skriv ${c("help")} for at komme i gang — eller klik på en kommando.\n`);
}

/* matrix rain */
const rainEl = document.getElementById("rain");
(function rain() {
  const ctx = rainEl.getContext("2d");
  const chars = "01アイウエオカキクケコサシスセソタチツテト<>/{}[]#$%&*01";
  const size = 16;
  let cols, drops;
  function resize() {
    rainEl.width = innerWidth; rainEl.height = innerHeight;
    cols = Math.ceil(innerWidth / size);
    drops = Array.from({ length: cols }, () => Math.random() * -50);
  }
  resize(); addEventListener("resize", resize);
  let last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 55) return;   // ~18 fps — rolig og let for CPU'en
    last = t;
    ctx.fillStyle = "rgba(10,14,10,0.12)";
    ctx.fillRect(0, 0, rainEl.width, rainEl.height);
    ctx.font = size + "px monospace";
    for (let i = 0; i < cols; i++) {
      const y = drops[i] * size;
      ctx.fillStyle = Math.random() < 0.04 ? "#d9ffe0" : "#39ff6a";
      ctx.fillText(chars[Math.random() * chars.length | 0], i * size, y);
      if (y > rainEl.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  requestAnimationFrame(frame);
})();

/* boot sequence */
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* ===== INTRO ===== */
async function intro() {
  const el = document.getElementById("intro");
  let saved = null;
  try { saved = sessionStorage.getItem("user"); } catch (e) {}
  if (saved) { setUser(saved); el.remove(); return; }
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const log = document.getElementById("intro-log");
  const scan = document.getElementById("intro-scan");
  const box = document.getElementById("intro-login");
  const granted = document.getElementById("intro-granted");

  let skipped = reduced;
  const wait = async (ms) => { const end = Date.now() + ms; while (!skipped && Date.now() < end) await sleep(16); };
  const rnd = (n) => Math.random() * n | 0;
  const hex = (n) => Array.from({ length: n }, () => rnd(16).toString(16)).join("");

  /* --- fase 1: kernel boot --- */
  const bootLines = [
    "[    0.000000] Linux version 6.9.0-signal (root@signal) #1 SMP PREEMPT",
    "[    0.000000] Command line: BOOT_IMAGE=/vmlinuz root=/dev/mapper/crypt ro quiet",
    "[    0.004213] x86/fpu: Supporting XSAVE feature 0x001",
    "[    0.031337] Memory: 16384K/16777216K available",
    "[    0.118204] random: crng init done",
    "[    0.402911] cryptd: max_cpu_qlen set to 1000",
    "[    0.733102] NET: Registered PF_INET6 protocol family",
    "[    1.002210] dm-crypt: unlocking volume /dev/sda2",
    "[  <span class=ok>OK</span>  ] Started <span class=hi>Network Manager</span>.",
    "[  <span class=ok>OK</span>  ] Reached target <span class=hi>Tor Relay</span>.",
    "[  <span class=ok>OK</span>  ] Started <span class=hi>OSINT Collector Daemon</span>.",
    "[  <span class=ok>OK</span>  ] Mounted <span class=hi>/srv/intel</span>.",
    "[  <span class=red>!!</span>  ] Unknown connection from <span class=hi>visitor</span> — tracing...",
  ];
  for (const l of bootLines) {
    if (skipped) break;
    log.innerHTML += l + "\n";
    for (let i = 0; i < 3 && !skipped; i++) {
      log.innerHTML += `<span>[${(performance.now() / 1000).toFixed(6).padStart(12)}] 0x${hex(8)} ${hex(24)}</span>\n`;
    }
    log.scrollTop = log.scrollHeight;
    await wait(55);
  }
  await wait(350);
  log.style.transition = "opacity .3s"; log.style.opacity = "0";
  await wait(300);

  /* --- fase 2: OSINT-scanning af den besøgende (alt lokalt i browseren) --- */
  const ua = navigator.userAgent;
  const os = /Windows/.test(ua) ? "Windows" : /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS"
    : /Mac/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "unknown";
  const br = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox"
    : /Safari\//.test(ua) ? "Safari" : "unknown";
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown");
  const rows = [
    ["target", "visitor"],
    ["os", os],
    ["browser", br],
    ["timezone", tz],
    ["screen", `${screen.width}x${screen.height}`],
    ["lang", navigator.language || "unknown"],
    ["status", "<span style='color:var(--warn)'>identified</span>"],
  ];
  let html = `<span class=v>$</span> trace --target visitor\n\n`;
  scan.innerHTML = html + "<span class=cur>&nbsp;</span>";
  await wait(300);
  for (const [k, v] of rows) {
    if (skipped) break;
    // "scramble" værdien kort før den låses
    for (let i = 0; i < 4 && !skipped; i++) {
      scan.innerHTML = html + `<span class=k>${k.padEnd(10, ".")}</span> <span class=v>${hex(8)}</span>`;
      await wait(35);
    }
    html += `<span class=k>${k.padEnd(10, ".")}</span> <span class=v>${v}</span>\n`;
    scan.innerHTML = html + "<span class=cur>&nbsp;</span>";
    await wait(110);
  }
  await wait(650);
  scan.style.transition = "opacity .3s"; scan.style.opacity = "0";
  await wait(250);

  /* --- fase 3: login (TTY-konsol à la Kali) --- */

  const host = "signal";
  box.innerHTML = `
    <div class="titlebar">
      <span class="tb-btn" title="Ny fane"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M8 5.5v5M5.5 8h5"/></svg></span>
      <span class="tb-title">guest@${host}: ~</span>
      <span class="tb-btn opt" title="Søg"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 13.5 13.5"/></svg></span>
      <span class="tb-btn opt" title="Menu"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg></span>
      <span class="tb-win" data-win><svg viewBox="0 0 10 10"><path d="M2 5h6"/></svg></span>
      <span class="tb-win" data-win><svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6"/></svg></span>
      <span class="tb-win close" data-win><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5"/></svg></span>
    </div>
    <div class="body"></div>`;
  const body = box.querySelector(".body");
  // vinduesknapperne virker ikke — der er ingen vej udenom login ;)
  box.querySelectorAll("[data-win]").forEach(btn => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    box.classList.remove("jolt"); void box.offsetWidth; box.classList.add("jolt");
  }));
  // træk vinduet rundt i titellinjen
  const bar = box.querySelector(".titlebar");
  let drag = null;
  bar.addEventListener("pointerdown", (e) => {
    if (e.target.closest("[data-win], .tb-btn")) return;
    const r = box.getBoundingClientRect();
    drag = { dx: e.clientX - (r.left + r.width / 2), dy: e.clientY - (r.top + r.height / 2) };
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove", (e) => {
    if (!drag) return;
    box.style.left = (e.clientX - drag.dx) + "px";
    box.style.top = (e.clientY - drag.dy) + "px";
  });
  bar.addEventListener("pointerup", () => { drag = null; inpFocus(); });
  let inpFocus = () => {};
  const type = async (text, speed = 18) => {
    const t = document.createTextNode("");
    body.appendChild(t);
    for (const ch of text) { t.data += ch; if (!reduced) await sleep(speed); }
  };
  const line = (html, cls = "") => {
    const l = document.createElement("div");
    if (cls) l.className = cls;
    l.innerHTML = html; body.appendChild(l); return l;
  };
  const b64 = (n) => Array.from({ length: n }, () =>
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"[rnd(64)]).join("");

  box.classList.add("show");
  await sleep(reduced ? 0 : 350);

  // SSH-handshake
  await type(`$ ssh guest@engin.dk -p 2222\n`, 22);
  await sleep(200);
  const hs = [
    `<span class="dim">[*] connecting to engin.dk:2222 ...</span>`,
    `<span class="dim">[*] kex: curve25519-sha256 · cipher: aes-256-gcm</span>`,
    `<span class="dim">[*] host key: SHA256:${b64(28)}</span>`,
    `[<span class="acc">+</span>] encrypted tunnel established`,
  ];
  for (const h of hs) { line(h); await sleep(reduced ? 0 : 230); }
  await sleep(200);
  line(`WARNING: unauthorized access is prohibited.\nall activity on this system is logged.`, "warnline");
  await sleep(250);

  // login-prompt med blinkende blok-markør
  const row = document.createElement("div");
  row.innerHTML = `<span class="acc">${host} login:</span> <span class="typed"></span><span class="blk">&nbsp;</span>`;
  const typed = row.querySelector(".typed");
  const inp = document.createElement("input");
  inp.className = "login-input ghost";
  inp.maxLength = 16;
  inp.autocomplete = "off"; inp.spellcheck = false; inp.setAttribute("autocapitalize", "off");
  inp.setAttribute("aria-label", "Dit navn");
  inp.addEventListener("input", () => { typed.textContent = inp.value; });
  const hint = document.createElement("div");
  hint.className = "dim";
  hint.textContent = "\n// skriv dit navn og tryk enter\n// eller tryk bare enter for at logge ind som visitor";
  body.append(row, inp, hint);
  inpFocus = () => inp.focus();
  el.addEventListener("click", () => inp.focus());
  inp.focus();

  const raw = await new Promise(res => inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); res(inp.value); }
  }));
  const name = raw.toLowerCase().replace(/[^a-z0-9æøå_-]/g, "").slice(0, 16) || "visitor";
  typed.textContent = name;
  row.querySelector(".blk").remove();
  inp.remove();
  hint.remove();

  // Password: ekkoer intet, ligesom en rigtig konsol
  const pw = line(`<span class="acc">Password:</span> <span class="blk">&nbsp;</span>`);
  await sleep(reduced ? 0 : 800);
  pw.innerHTML = `<span class="acc">Password:</span>`;

  // verifying-spinner
  const ver = line(`<span class="dim">verifying credentials</span> <span class="acc spin">|</span>`);
  const spin = ver.querySelector(".spin");
  const frames = "|/-\\";
  for (let i = 0; i < (reduced ? 1 : 12); i++) { spin.textContent = frames[i % 4]; await sleep(70); }
  spin.textContent = "ok";

  const d = new Date();
  const stamp = d.toDateString() + " " + d.toTimeString().slice(0, 8);
  const motd = [
    `<span class="dim">Last login: ${stamp} from tunnel</span>`,
    `[<span class="acc">+</span>] access granted · <span class="acc">${esc(name)}</span>@${host}`,
  ];
  for (const m of motd) {
    const l = document.createElement("div"); l.innerHTML = m; body.appendChild(l);
    await sleep(150);
  }
  box.classList.add("jolt");
  setUser(name);
  try { sessionStorage.setItem("user", name); } catch (e) {}
  await sleep(400);

  /* --- fase 4: welcome → CRT off --- */
  granted.textContent = `WELCOME, ${name.toUpperCase()}`;
  granted.classList.add("show");
  await sleep(reduced ? 300 : 1000);

  if (!reduced) { el.classList.add("off"); await sleep(560); }
  el.remove();
}

/* ===== LOGIN ===== */
let USER = "visitor";
let activeInput = null;
function setUser(n) {
  USER = n;   // bruges i velkomst, sudo, matrix og whois — prompten er altid engin@erkus
}
async function boot() {
  await intro();
  const steps = [
    ["[ ok ] initializing session...", "dim"],
    ["[ ok ] routing through 3 relays...", "dim"],
    ["[ ok ] handshake complete", "dim"],
  ];
  for (const [t, cls] of steps) { print(t, cls); await sleep(260); }
  await sleep(150);
  showHome();
  inputLine.hidden = false;
  input.focus();
}
boot();
</script>
